<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>加入企业微信群</title>
  <script src="https://res.wx.qq.com/open/js/jweixin-1.3.2.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: #f5f7fa;
      box-sizing: border-box;
    }
    .btn {
      width: 100%;
      max-width: 320px;
      height: 48px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #07c160;
    }
    .btn:active { background: #06ad56; }
    .btn:disabled { opacity: 0.45; }
  </style>
</head>
<body>
  <button id="goJoinBtn" class="btn" type="button" disabled>加入企业微信群</button>
  <script>
    (function () {
      var JOIN_URL = 'https://work.weixin.qq.com/gm/5fdd2cb348c86f9b99d7577b5d383541';
      var MP_PAGE = '/main/pages/my/wecom-join-group?url=' + encodeURIComponent(JOIN_URL);
      var btn = document.getElementById('goJoinBtn');
      var jumping = false;

      function ready() {
        btn.disabled = false;
      }

      function detect() {
        if (typeof wx !== 'undefined' && wx.miniProgram && wx.miniProgram.getEnv) {
          wx.miniProgram.getEnv(function (res) {
            if (res && res.miniprogram) ready();
            else if (/miniProgram/i.test(navigator.userAgent) || window.__wxjs_environment === 'miniprogram') ready();
          });
          return;
        }
        if (/miniProgram/i.test(navigator.userAgent) || window.__wxjs_environment === 'miniprogram') ready();
      }

      btn.addEventListener('click', function () {
        if (jumping || !wx || !wx.miniProgram) return;
        jumping = true;
        wx.miniProgram.navigateTo({
          url: MP_PAGE,
          complete: function () { jumping = false; },
          fail: function () {
            wx.miniProgram.redirectTo({ url: MP_PAGE });
          }
        });
      });

      if (!window.WeixinJSBridge || !WeixinJSBridge.invoke) {
        document.addEventListener('WeixinJSBridgeReady', detect, false);
      }
      detect();
    })();
  </script>
</body>
</html>
